name: Build and Run Hello World (CMake)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CMake and Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang llvm

    - name: Verify cmake installation
      run: cmake --version

    - name: Configure with CMake
      run: cmake -B build

    - name: Build Hello World
      run: cmake --build build

    - name: Execute Hello World
      run: ./build/hello
